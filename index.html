<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio25 Radio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    font-family:"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 15%,#18295c 0%,transparent 35%),
        radial-gradient(circle at 85% 80%,#40144d 0%,transparent 35%),
        linear-gradient(145deg,#030711,#02030a);
    color:white;
}

.player{
    width:100%;
    max-width:430px;
    text-align:center;
    padding:24px 20px 25px;
    border-radius:28px;
    background:rgba(5,8,18,.94);
    border:1px solid #27334d;
    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        0 0 50px rgba(0,110,255,.16);
}

/* ENCABEZADO */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
}

.live{
    font-size:25px;
    font-weight:700;
    color:#ff3030;
    white-space:nowrap;
}

.live-dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ff3030;
    box-shadow:0 0 12px #ff3030;
    margin-right:7px;
}

.station{
    font-size:22px;
    font-weight:600;
}

.online{
    border:1px solid #27334d;
    border-radius:25px;
    padding:9px 13px;
    font-size:14px;
    color:#e5e7eb;
    white-space:nowrap;
}

.online-dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#22e56b;
    box-shadow:0 0 10px #22e56b;
    margin-right:6px;
}

.tagline{
    font-size:18px;
    color:#d7dbe5;
    margin-bottom:18px;
}

/* LOGO */
.logo{
    width:100%;
    max-width:390px;
    display:block;
    margin:0 auto 20px;
    border-radius:18px;
    box-shadow:
        0 0 25px rgba(37,99,235,.25),
        0 0 45px rgba(239,68,68,.12);
}

/* SONANDO AHORA */
.now-title{
    color:#18a1ff;
    font-size:20px;
    font-weight:600;
    margin:4px 0 8px;
    letter-spacing:.5px;
}

.song{
    font-size:25px;
    line-height:1.18;
    font-weight:300;
    color:#ffffff;
    margin:0 auto;
    max-width:390px;
}

.artist{
    font-size:18px;
    font-weight:300;
    color:#4db8ff;
    margin-top:7px;
}

/* ECUALIZADOR */
.equalizer{
    height:68px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:4px;
    margin:13px auto 15px;
}

.bar{
    width:6px;
    height:15px;
    border-radius:5px;
    background:linear-gradient(to top,#1677ff,#39b7ff,#ff30c8);
    box-shadow:0 0 8px rgba(40,150,255,.5);
    animation:equalize .9s ease-in-out infinite alternate;
    animation-play-state:paused;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.25s}
.bar:nth-child(4){animation-delay:.4s}
.bar:nth-child(5){animation-delay:.15s}
.bar:nth-child(6){animation-delay:.35s}
.bar:nth-child(7){animation-delay:.05s}
.bar:nth-child(8){animation-delay:.3s}
.bar:nth-child(9){animation-delay:.2s}
.bar:nth-child(10){animation-delay:.45s}
.bar:nth-child(11){animation-delay:.1s}
.bar:nth-child(12){animation-delay:.3s}
.bar:nth-child(13){animation-delay:.15s}
.bar:nth-child(14){animation-delay:.4s}
.bar:nth-child(15){animation-delay:.2s}
.bar:nth-child(16){animation-delay:.35s}
.bar:nth-child(17){animation-delay:.05s}
.bar:nth-child(18){animation-delay:.25s}
.bar:nth-child(19){animation-delay:.1s}
.bar:nth-child(20){animation-delay:.4s}
.bar:nth-child(21){animation-delay:.2s}

@keyframes equalize{
    0%{height:10px}
    25%{height:30px}
    50%{height:65px}
    75%{height:25px}
    100%{height:50px}
}

/* BOTÓN */
.play-button{
    width:92px;
    height:92px;
    border-radius:50%;
    border:2px solid #2196ff;
    background:linear-gradient(145deg,#101522,#05070c);
    color:white;
    font-size:37px;
    cursor:pointer;
    box-shadow:
        0 0 20px rgba(33,150,255,.4),
        inset 0 0 15px rgba(33,150,255,.12);
    transition:.2s;
}

.play-button:hover{
    transform:scale(1.05);
}

.play-button:active{
    transform:scale(.94);
}

.playing{
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 15px rgba(37,99,235,.4);
    }
    50%{
        box-shadow:0 0 45px rgba(37,99,235,.8);
    }
    100%{
        box-shadow:0 0 15px rgba(37,99,235,.4);
    }
}

/* VOLUMEN */
.volume{
    display:flex;
    align-items:center;
    gap:10px;
    margin:17px auto 18px;
    max-width:330px;
}

.volume-icon{
    font-size:23px;
}

.volume input{
    width:100%;
    accent-color:#2196ff;
}

/* COMPARTIR */
.share-button{
    width:100%;
    max-width:330px;
    margin:5px auto 18px;
    padding:13px 20px;
    border-radius:30px;
    border:1px solid #246dff;
    background:linear-gradient(90deg,rgba(20,100,255,.13),rgba(255,30,190,.10));
    color:#ffffff;
    font-size:17px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 0 18px rgba(30,120,255,.12);
}

.share-button:hover{
    box-shadow:0 0 25px rgba(30,120,255,.3);
}

/* INFORMACIÓN SIMPLE */
.info{
    border-top:1px solid #27334d;
    padding-top:18px;
    margin-top:3px;
    color:#aeb6c7;
    font-size:15px;
}

.info strong{
    color:#ffffff;
    font-weight:500;
}

/* MENSAJE */
.thanks{
    margin-top:18px;
    padding:15px;
    border:1px solid #27334d;
    border-radius:22px;
    color:#d7dbe5;
    font-size:16px;
}

.thanks b{
    color:#39a9ff;
}

audio{
    display:none;
}

@media(max-width:400px){

    body{
        padding:10px;
    }

    .player{
        padding:20px 14px 22px;
    }

    .live{
        font-size:21px;
    }

    .station{
        font-size:19px;
    }

    .online{
        font-size:12px;
        padding:8px 10px;
    }

    .tagline{
        font-size:16px;
    }

    .song{
        font-size:23px;
    }

    .logo{
        max-width:350px;
    }
}
</style>
</head>

<body>

<div class="player">

    <div class="top">
        <div class="live">
            <span class="live-dot"></span>EN VIVO
        </div>

        <div class="station">
            Studio25
        </div>

        <div class="online">
            <span class="online-dot"></span>Señal en línea
        </div>
    </div>

    <div class="tagline">
        Llevando música y entretención para ti
    </div>

    <img
        class="logo"
        src="archivo_000000001a74720e9d613f259602beca.png"
        alt="Studio25 Radio"
    >

    <div class="now-title">
        ♪ SONANDO AHORA
    </div>

    <div class="song" id="song">
        Studio25 Radio
    </div>

    <div class="artist" id="artist">
        Radio Online
    </div>

    <div class="equalizer" id="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <button class="play-button" id="playButton">▶</button>

    <div class="volume">
        <span class="volume-icon">🔊</span>
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >
    </div>

    <button class="share-button" id="shareButton">
        📤 Compartir radio
    </button>

    <div class="info">
        <strong>Studio25</strong> · Radio Online
        &nbsp;•&nbsp;
        <strong>Longaví</strong> para el mundo
    </div>

    <div class="thanks">
        ❤️ Gracias por preferir <b>Studio25</b>
    </div>

    <audio id="radio" preload="none">
        <source
            src="https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3"
            type="audio/mpeg"
        >
    </audio>

</div>

<script>

const radio = document.getElementById("radio");
const button = document.getElementById("playButton");
const bars = document.querySelectorAll(".bar");
const volume = document.getElementById("volume");

const song = document.getElementById("song");
const artist = document.getElementById("artist");
const shareButton = document.getElementById("shareButton");

const streamUrl =
"https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3";

const statusUrl =
new URL(streamUrl).origin + "/status-json.xsl";

/* VOLUMEN */
radio.volume = 0.8;

volume.addEventListener("input",function(){
    radio.volume = this.value;
});

/* PLAY / PAUSA */
button.addEventListener("click",function(){

    if(radio.paused){

        radio.play().then(function(){

            button.textContent="❚❚";
            button.classList.add("playing");

            bars.forEach(function(bar){
                bar.style.animationPlayState="running";
            });

        }).catch(function(){

            song.textContent="No se pudo iniciar la radio";
            artist.textContent="Toca ▶ nuevamente";

        });

    }else{

        radio.pause();

        button.textContent="▶";
        button.classList.remove("playing");

        bars.forEach(function(bar){
            bar.style.animationPlayState="paused";
        });
    }

});

/* CUANDO TERMINA */
radio.addEventListener("ended",function(){

    button.textContent="▶";
    button.classList.remove("playing");

    bars.forEach(function(bar){
        bar.style.animationPlayState="paused";
    });

});

/* SONANDO AHORA */
async function actualizarCancion(){

    try{

        const respuesta = await fetch(
            statusUrl + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

        if(!respuesta.ok){
            throw new Error("No disponible");
        }

        const datos = await respuesta.json();

        let fuente = datos.icestats && datos.icestats.source;

        if(!fuente){
            return;
        }

        if(Array.isArray(fuente)){
            fuente = fuente[0];
        }

        if(fuente.title){

            let titulo = fuente.title.trim();

            if(titulo.includes(" - ")){

                const partes = titulo.split(" - ");

                artist.textContent = partes.shift().trim();
                song.textContent = partes.join(" - ").trim();

            }else{

                song.textContent = titulo;
                artist.textContent = "Studio25";
            }
        }

    }catch(error){

        console.log("Metadata no disponible:",error);

    }

}

/* ACTUALIZA CADA 10 SEGUNDOS */
actualizarCancion();

setInterval(actualizarCancion,10000);

/* COMPARTIR */
shareButton.addEventListener("click",async function(){

    const enlace = window.location.href;

    if(navigator.share){

        try{

            await navigator.share({
                title:"Studio25 Radio",
                text:"🎵 Escucha Studio25 Radio Online",
                url:enlace
            });

        }catch(error){
            console.log("Compartir cancelado");
        }

    }else{

        try{

            await navigator.clipboard.writeText(enlace);

            shareButton.textContent="✓ Enlace copiado";

            setTimeout(function(){
                shareButton.textContent="📤 Compartir radio";
            },2000);

        }catch(error){

            alert("Copia este enlace para compartir Studio25:\n\n" + enlace);

        }

    }

});

</script>

</body>
</html>
