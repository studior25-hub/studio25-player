<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio25 Radio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 20%,#35135f 0%,transparent 35%),
        linear-gradient(145deg,#030305,#0b0712,#020204);
    color:white;
}

.player{
    width:100%;
    max-width:430px;
    text-align:center;
    padding:25px 20px 30px;
    border-radius:28px;
    background:rgba(8,8,15,.78);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 0 30px rgba(80,40,150,.08);
    backdrop-filter:blur(10px);
}

/* LOGO */
.logo{
    width:260px;
    max-width:80%;
    border-radius:50%;
    display:block;
    margin:0 auto 20px;
    box-shadow:
        0 0 25px rgba(37,99,235,.35),
        0 0 45px rgba(239,68,68,.15);
}

/* ECUALIZADOR */
.equalizer{
    height:75px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:4px;
    margin:5px auto 22px;
}

.bar{
    width:6px;
    height:15px;
    border-radius:5px;
    background:linear-gradient(to top,#1677ff,#39b7ff,#ff3030);
    box-shadow:0 0 8px rgba(40,150,255,.5);
    animation:equalize .9s ease-in-out infinite alternate;
    animation-play-state:paused;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.25s}
.bar:nth-child(4){animation-delay:.4s}
.bar:nth-child(5){animation-delay:.15s}
.bar:nth-child(6){animation-delay:.35s}
.bar:nth-child(7){animation-delay:.05s}
.bar:nth-child(8){animation-delay:.3s}
.bar:nth-child(9){animation-delay:.2s}
.bar:nth-child(10){animation-delay:.45s}
.bar:nth-child(11){animation-delay:.1s}
.bar:nth-child(12){animation-delay:.3s}
.bar:nth-child(13){animation-delay:.15s}
.bar:nth-child(14){animation-delay:.4s}
.bar:nth-child(15){animation-delay:.2s}
.bar:nth-child(16){animation-delay:.35s}
.bar:nth-child(17){animation-delay:.05s}
.bar:nth-child(18){animation-delay:.25s}
.bar:nth-child(19){animation-delay:.1s}
.bar:nth-child(20){animation-delay:.4s}
.bar:nth-child(21){animation-delay:.2s}

@keyframes equalize{
    0%{height:10px}
    25%{height:30px}
    50%{height:65px}
    75%{height:25px}
    100%{height:50px}
}

/* BOTÓN */
.play-button{
    width:82px;
    height:82px;
    border-radius:50%;
    border:2px solid #2196ff;
    background:linear-gradient(145deg,#101522,#05070c);
    color:white;
    font-size:34px;
    cursor:pointer;
    box-shadow:
        0 0 20px rgba(33,150,255,.4),
        inset 0 0 15px rgba(33,150,255,.12);
    transition:.2s;
}

.play-button:hover{
    transform:scale(1.05);
}

.play-button:active{
    transform:scale(.94);
}

.playing{
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 15px rgba(37,99,235,.4);
    }
    50%{
        box-shadow:0 0 45px rgba(37,99,235,.8);
    }
    100%{
        box-shadow:0 0 15px rgba(37,99,235,.4);
    }
}

.status{
    margin-top:18px;
    color:#9ca3af;
    font-size:16px;
}

.status.live{
    color:#22c55e;
}

audio{
    display:none;
}

@media(max-width:400px){
    .logo{
        width:230px;
    }

    .equalizer{
        height:65px;
    }
}
</style>
</head>

<body>

<div class="player">

    <img
        class="logo"
        src="archivo_000000001a74720e9d613f259602beca.png"
        alt="Studio25 Radio"
    >

    <div class="equalizer" id="equalizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <button class="play-button" id="playButton">▶</button>

    <div class="status" id="status">
        Presiona ▶ para escuchar Studio25
    </div>

    <audio id="radio">
        <source src="https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

const radio = document.getElementById("radio");
const button = document.getElementById("playButton");
const status = document.getElementById("status");
const bars = document.querySelectorAll(".bar");

button.addEventListener("click",function(){

    if(radio.paused){

        radio.play();

        button.textContent="❚❚";
        button.classList.add("playing");

        status.textContent="🔴 EN VIVO · Studio25";
        status.classList.add("live");

        bars.forEach(bar=>{
            bar.style.animationPlayState="running";
        });

    }else{

        radio.pause();

        button.textContent="▶";
        button.classList.remove("playing");

        status.textContent="Presiona ▶ para escuchar Studio25";
        status.classList.remove("live");

        bars.forEach(bar=>{
            bar.style.animationPlayState="paused";
        });
    }
});

radio.addEventListener("ended",function(){
    button.textContent="▶";
    button.classList.remove("playing");
});

</script>

</body>
</html>
