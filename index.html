<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Studio25 Radio</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 font-family:Arial,sans-serif;
 color:white;
 background:
 radial-gradient(circle at 15% 20%,#18295c 0%,transparent 35%),
 radial-gradient(circle at 85% 80%,#40144d 0%,transparent 35%),
 #030711;
}

.player{
 width:min(1100px,100%);
 border:1px solid #27334d;
 border-radius:28px;
 padding:28px;
 background:rgba(4,9,20,.94);
 box-shadow:0 0 50px rgba(0,110,255,.16);
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:22px;
}

.live{
 font-size:34px;
 font-weight:800;
 letter-spacing:.5px;
}

.live span{color:#ff3038}

.station{
 font-size:34px;
 margin-left:10px;
}

.online{
 border:1px solid #26344d;
 border-radius:30px;
 padding:12px 18px;
 font-size:16px;
}

.online i{
 display:inline-block;
 width:12px;
 height:12px;
 border-radius:50%;
 background:#28e878;
 margin-right:8px;
 box-shadow:0 0 12px #28e878;
}

.subtitle{
 font-size:22px;
 color:#d8dce7;
 margin-bottom:25px;
}

.main{
 display:grid;
 grid-template-columns:330px 1fr;
 gap:35px;
 align-items:center;
}

.logoBox{
 height:360px;
 border-radius:25px;
 padding:4px;
 background:linear-gradient(135deg,#22aaff,#ff43d7);
 box-shadow:0 0 30px rgba(30,150,255,.25);
}

.logoInner{
 height:100%;
 border-radius:22px;
 overflow:hidden;
 background:#080d19;
 display:flex;
 align-items:center;
 justify-content:center;
}

.logoInner img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.right{
 display:flex;
 flex-direction:column;
 gap:24px;
}

.playArea{
 display:flex;
 align-items:center;
 gap:30px;
}

.play{
 width:150px;
 height:150px;
 border-radius:50%;
 border:2px solid #20a9ff;
 background:#07101d;
 color:white;
 font-size:65px;
 cursor:pointer;
 box-shadow:0 0 25px rgba(20,160,255,.4);
 transition:.2s;
}

.play:hover{
 transform:scale(1.04);
 box-shadow:0 0 38px rgba(20,160,255,.7);
}

.now{
 border-left:1px solid #293247;
 padding-left:30px;
 min-height:125px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.nowLabel{
 color:#22aaff;
 font-size:22px;
 font-weight:bold;
 margin-bottom:14px;
}

.song{
 font-size:30px;
 font-weight:bold;
 line-height:1.2;
 word-break:break-word;
}

.status{
 color:#9ca5b8;
 margin-top:8px;
}

.volume{
 display:flex;
 align-items:center;
 gap:15px;
}

.volume span{
 font-size:27px;
}

.volume input{
 width:330px;
 accent-color:#209dff;
}

.eq{
 height:120px;
 display:flex;
 align-items:end;
 justify-content:center;
 gap:8px;
 overflow:hidden;
}

.eq b{
 width:13px;
 border-radius:5px 5px 0 0;
 background:linear-gradient(#ff39dc,#246eff);
 animation:beat 1s infinite ease-in-out alternate;
}

.eq b:nth-child(2n){animation-delay:.15s}
.eq b:nth-child(3n){animation-delay:.3s}
.eq b:nth-child(4n){animation-delay:.45s}

@keyframes beat{
 from{height:18px;opacity:.45}
 to{height:100px;opacity:1}
}

.info{
 margin-top:25px;
 padding-top:22px;
 border-top:1px solid #20283a;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
}

.infoBox{
 display:flex;
 align-items:center;
 gap:15px;
 color:#b9c0cf;
 font-size:17px;
}

.icon{
 font-size:35px;
 color:#299cff;
}

.bottom{
 margin-top:22px;
 padding:18px;
 border:1px solid #202b40;
 border-radius:18px;
 text-align:center;
 color:#c7ccda;
 font-size:18px;
}

@media(max-width:750px){
 body{padding:10px}
 .player{padding:18px;border-radius:20px}
 .top{align-items:flex-start;gap:12px}
 .live,.station{font-size:23px}
 .online{font-size:13px;padding:8px 11px}
 .subtitle{font-size:17px}
 .main{grid-template-columns:1fr}
 .logoBox{height:300px}
 .playArea{justify-content:center}
 .now{border-left:0;padding-left:0;text-align:center}
 .song{font-size:23px}
 .volume{justify-content:center}
 .volume input{width:220px}
 .info{grid-template-columns:1fr}
 .eq{display:none}
}
</style>
</head>

<body>

<div class="player">

 <div class="top">
   <div>
     <span class="live"><span>●</span> EN VIVO</span>
     <span class="station">| Studio25</span>
   </div>

   <div class="online">
     <i></i><span id="onlineText">Señal en línea</span>
   </div>
 </div>

 <div class="subtitle">
   Llevando música y entretención para ti
 </div>

 <div class="main">

   <div class="logoBox">
     <div class="logoInner">
       <img
        src="https://raw.githubusercontent.com/studior25-hub/studio25-player/main/file_000000001a74720e9d613f259602beca.png"
        alt="Studio25">
     </div>
   </div>

   <div class="right">

     <div class="playArea">

       <button class="play" id="playBtn" aria-label="Reproducir">
         ▶
       </button>

       <div class="now">
         <div class="nowLabel">🎵 SONANDO AHORA</div>

         <div class="song" id="song">
           Presiona ▶ para escuchar Studio25
         </div>

         <div class="status" id="status">
           Radio Online
         </div>
       </div>

     </div>

     <div class="volume">
       <span>🔊</span>
       <input id="volume" type="range" min="0" max="1"
              step="0.01" value="0.8">
     </div>

     <div class="eq">
       <b></b><b></b><b></b><b></b><b></b><b></b>
       <b></b><b></b><b></b><b></b><b></b><b></b>
       <b></b><b></b><b></b><b></b><b></b><b></b>
       <b></b><b></b>
     </div>

   </div>
 </div>

 <div class="info">

   <div class="infoBox">
     <div class="icon">📡</div>
     <div>
       <strong>Studio25</strong><br>
       Radio Online
     </div>
   </div>

   <div class="infoBox">
     <div class="icon">🎧</div>
     <div>
       <strong>Transmisión</strong><br>
       Studio25 en vivo
     </div>
   </div>

   <div class="infoBox">
     <div class="icon">🌎</div>
     <div>
       <strong>Longaví</strong><br>
       Para el mundo
     </div>
   </div>

 </div>

 <div class="bottom">
   ❤️ Gracias por preferir <strong>Studio25</strong>
 </div>

</div>

<script type="module">

import IcecastMetadataPlayer
from "https://esm.sh/icecast-metadata-player@1.17.13";

const STREAM =
"https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3";

const song = document.getElementById("song");
const status = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const volume = document.getElementById("volume");
const onlineText = document.getElementById("onlineText");

const player = new IcecastMetadataPlayer(STREAM,{
 metadataTypes:["icy"],

 onMetadata(metadata){

   const title =
     metadata.StreamTitle ||
     metadata.TITLE ||
     "";

   if(title.trim()){
     song.textContent = title.trim();
   }

 },

 onLoad(){
   status.textContent = "Transmitiendo en vivo";
   onlineText.textContent = "Señal en línea";
 },

 onError(){
   status.textContent =
     "Intentando reconectar con Studio25...";
 }

});

player.audioElement.volume = 0.8;

playBtn.addEventListener("click",async()=>{

 try{

   if(player.audioElement.paused){

     await player.play();

     playBtn.textContent = "❚❚";
     status.textContent = "Studio25 sonando en vivo";
     onlineText.textContent = "Señal en línea";

   }else{

     player.stop();

     playBtn.textContent = "▶";
     status.textContent = "Reproducción detenida";

   }

 }catch(error){

   console.error(error);

   status.textContent =
     "No se pudo iniciar la transmisión";

 }

});

volume.addEventListener("input",()=>{
 player.audioElement.volume = volume.value;
});

</script>

</body>
</html>
