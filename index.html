<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio25 Radio Online</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player {
  width: min(92%, 420px);
  background: #181818;
  border-radius: 22px;
  padding: 22px;
  text-align: center;
  color: white;
  box-shadow: 0 12px 35px rgba(0,0,0,.45);
}

.logo {
  width: 150px;
  max-width: 70%;
  margin: 0 auto 10px;
  display: block;
}

h1 {
  margin: 5px 0 2px;
  font-size: 25px;
}

.subtitle {
  font-size: 13px;
  opacity: .7;
  margin-bottom: 15px;
}

.status {
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 12px;
  min-height: 18px;
}

.play-button {
  width: 72px;
  height: 72px;
  border: 0;
  border-radius: 50%;
  background: white;
  color: #111;
  font-size: 30px;
  cursor: pointer;
  margin: 5px auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-button:active {
  transform: scale(.96);
}

.equalizer {
  height: 42px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
  margin: 10px 0;
}

.bar {
  width: 5px;
  height: 8px;
  background: white;
  border-radius: 4px;
}

.equalizer.active .bar {
  animation: equalize .55s infinite ease-in-out alternate;
}

.bar:nth-child(2) { animation-delay: .1s; }
.bar:nth-child(3) { animation-delay: .2s; }
.bar:nth-child(4) { animation-delay: .3s; }
.bar:nth-child(5) { animation-delay: .15s; }
.bar:nth-child(6) { animation-delay: .25s; }
.bar:nth-child(7) { animation-delay: .05s; }

@keyframes equalize {
  from { height: 7px; }
  to { height: 38px; }
}

.location {
  margin-top: 12px;
  font-size: 12px;
  opacity: .65;
}
</style>
</head>

<body>

<div class="player">

  
file_000000001a74720e9d613f259602beca.png
  <h1>Studio25</h1>
  <div class="subtitle">Radio Online</div>

  <div id="status" class="status">ESPERANDO TRANSMISIÓN</div>

  <button id="playButton" class="play-button">▶</button>

  <div id="equalizer" class="equalizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div class="location">Desde Longaví, Chile</div>

  <audio id="radioAudio" preload="none">
    <source
      src="https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3"
      type="audio/mpeg">
  </audio>

</div>

<script>
const audio = document.getElementById("radioAudio");
const button = document.getElementById("playButton");
const status = document.getElementById("status");
const equalizer = document.getElementById("equalizer");

function esperarTransmision() {
  status.textContent = "ESPERANDO TRANSMISIÓN";
  equalizer.classList.remove("active");
  button.textContent = "▶";
}

button.addEventListener("click", () => {

  if (audio.paused) {
    audio.play().catch(() => {
      esperarTransmision();
    });
  } else {
    audio.pause();
    audio.currentTime = 0;
    esperarTransmision();
  }

});

audio.addEventListener("playing", () => {
  status.textContent = "EN VIVO";
  button.textContent = "❚❚";
  equalizer.classList.add("active");
});

audio.addEventListener("pause", () => {
  if (!audio.ended) {
    esperarTransmision();
  }
});

audio.addEventListener("error", () => {
  esperarTransmision();
});

audio.addEventListener("stalled", () => {
  esperarTransmision();
});

audio.addEventListener("abort", () => {
  esperarTransmision();
});

audio.addEventListener("waiting", () => {
  /*
    No mostramos "Cargando..." ni "Conectando...".
    Mientras no haya audio real, queda esperando transmisión.
  */
  if (!audio.paused) {
    status.textContent = "ESPERANDO TRANSMISIÓN";
    equalizer.classList.remove("active");
  }
});

audio.addEventListener("canplay", () => {
  /*
    No cambiamos el estado aquí.
    Esperamos a que realmente empiece a sonar.
  */
});

esperarTransmision();
</script>

</body>
</html>
