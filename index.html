<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio25 Radio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,#18295c 0%,transparent 35%),
    radial-gradient(circle at 85% 80%,#40144d 0%,transparent 35%),
    #030711;
  display:flex;
  justify-content:center;
  align-items:center;
}

.player{
  width:min(900px,100%);
  background:rgba(4,9,20,.96);
  border:1px solid #27334d;
  border-radius:28px;
  padding:28px;
  box-shadow:0 0 50px rgba(0,110,255,.16);
}

/* CABECERA */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.live{
  font-size:30px;
  font-weight:bold;
  color:#ff3030;
}

.live-dot{
  display:inline-block;
  width:18px;
  height:18px;
  background:#ff3030;
  border-radius:50%;
  margin-right:10px;
  box-shadow:0 0 15px #ff3030;
}

.online{
  border:1px solid #27334d;
  border-radius:30px;
  padding:12px 18px;
  font-size:18px;
  color:#ddd;
}

.green{
  display:inline-block;
  width:14px;
  height:14px;
  background:#22ee73;
  border-radius:50%;
  margin-right:8px;
  box-shadow:0 0 12px #22ee73;
}

.slogan{
  text-align:center;
  font-size:21px;
  color:#ddd;
  margin:20px 0;
}

/* LOGO */

.logo{
  width:100%;
  max-width:560px;
  max-height:390px;
  object-fit:contain;
  display:block;
  margin:0 auto 15px;
}

/* SONANDO */

.now{
  text-align:center;
  margin-top:10px;
}

.now-title{
  font-size:25px;
  font-weight:bold;
  color:#219cff;
  margin-bottom:18px;
}

.song{
  font-size:29px;
  font-weight:400;
  color:white;
  line-height:1.25;
}

.artist{
  font-size:21px;
  color:#37aaff;
  margin-top:10px;
}

/* ECUALIZADOR */

.equalizer{
  height:65px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:5px;
  margin:28px 0 20px;
}

.bar{
  width:8px;
  height:15px;
  border-radius:5px;
  background:linear-gradient(to top,#168cff,#e642d8);
  animation:equal 1s infinite ease-in-out;
  box-shadow:0 0 10px rgba(40,130,255,.7);
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.5s}
.bar:nth-child(7){animation-delay:.6s}
.bar:nth-child(8){animation-delay:.7s}
.bar:nth-child(9){animation-delay:.8s}
.bar:nth-child(10){animation-delay:.9s}
.bar:nth-child(11){animation-delay:.2s}
.bar:nth-child(12){animation-delay:.4s}
.bar:nth-child(13){animation-delay:.6s}
.bar:nth-child(14){animation-delay:.8s}
.bar:nth-child(15){animation-delay:.3s}
.bar:nth-child(16){animation-delay:.5s}
.bar:nth-child(17){animation-delay:.7s}
.bar:nth-child(18){animation-delay:.9s}

@keyframes equal{
  0%,100%{height:12px}
  50%{height:55px}
}

/* PLAY */

.play{
  width:145px;
  height:145px;
  border-radius:50%;
  border:2px solid #229cff;
  background:#07101e;
  color:white;
  font-size:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0 auto 25px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(30,145,255,.45);
}

.play:active{
  transform:scale(.96);
}

/* VOLUMEN */

.volume{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  margin:10px auto 25px;
}

.volume span{
  font-size:25px;
}

input[type=range]{
  width:min(440px,70%);
  accent-color:#219cff;
}

/* COMPARTIR */

.share{
  width:100%;
  max-width:520px;
  margin:0 auto 28px;
  display:block;
  padding:15px;
  border-radius:30px;
  border:1px solid #219cff;
  background:linear-gradient(90deg,#071d55,#401344);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.share:active{
  transform:scale(.98);
}

/* INFO */

.info{
  border-top:1px solid #27334d;
  padding-top:22px;
  display:flex;
  justify-content:space-around;
  text-align:center;
  gap:15px;
}

.info-item{
  flex:1;
  font-size:17px;
  color:#aaa;
}

.info-item strong{
  display:block;
  color:white;
  font-size:18px;
  margin-bottom:5px;
}

/* PIE */

.footer{
  margin-top:22px;
  border:1px solid #27334d;
  border-radius:25px;
  padding:16px;
  text-align:center;
  font-size:18px;
  color:#ddd;
}

.footer b{
  color:#219cff;
}

/* CELULAR */

@media(max-width:600px){

  body{
    padding:10px;
  }

  .player{
    padding:20px 15px;
    border-radius:25px;
  }

  .top{
    flex-direction:column;
  }

  .live{
    font-size:28px;
  }

  .online{
    font-size:16px;
  }

  .slogan{
    font-size:19px;
  }

  .logo{
    max-height:360px;
  }

  .song{
    font-size:25px;
  }

  .artist{
    font-size:20px;
  }

  .play{
    width:140px;
    height:140px;
  }

  .info{
    flex-direction:column;
    gap:18px;
  }
}
</style>
</head>

<body>

<div class="player">

  <div class="top">
    <div class="live">
      <span class="live-dot"></span>EN VIVO
    </div>

    <div class="online">
      <span class="green"></span>Señal en línea
    </div>
  </div>

  <div class="slogan">
    Llevando música y entretención para ti
  </div>

  <!-- LOGO STUDIO25 -->
  <img
    class="logo"
    src="file_000000001a74720e9d613f259602beca.png"
    alt="Studio25 Radio"
  >

  <div class="now">

    <div class="now-title">
      ♪ SONANDO AHORA
    </div>

    <div class="song" id="song">
      Conectando con Studio25...
    </div>

    <div class="artist" id="artist">
      Radio Online
    </div>

  </div>

  <!-- ECUALIZADOR -->

  <div class="equalizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- AUDIO -->

  <audio
    id="radio"
    preload="none"
    src="https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3">
  </audio>

  <button class="play" id="play">
    ▶
  </button>

  <!-- VOLUMEN -->

  <div class="volume">
    <span>🔊</span>
    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.8">
  </div>

  <!-- COMPARTIR -->

  <button class="share" id="share">
    📤 Compartir radio
  </button>

  <!-- INFORMACIÓN -->

  <div class="info">

    <div class="info-item">
      <strong>Studio25</strong>
      Radio Online
    </div>

    <div class="info-item">
      <strong>Transmisión</strong>
      Studio25 en vivo
    </div>

    <div class="info-item">
      <strong>Longaví</strong>
      Para el mundo
    </div>

  </div>

  <div class="footer">
    ❤️ Gracias por preferir <b>Studio25</b>
  </div>

</div>


<script>

const radio = document.getElementById("radio");
const play = document.getElementById("play");
const volume = document.getElementById("volume");

const song = document.getElementById("song");
const artist = document.getElementById("artist");

const STREAM_URL =
"https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3";

const META_URL =
"https://api.twj.es/?url=" + encodeURIComponent(STREAM_URL);


/* PLAY / PAUSA */

play.addEventListener("click", async () => {

  if(radio.paused){

    try{
      await radio.play();
      play.textContent = "❚❚";
    }catch(error){
      console.log(error);
      alert("No se pudo iniciar la transmisión.");
    }

  }else{

    radio.pause();
    play.textContent = "▶";

  }

});


/* VOLUMEN */

volume.addEventListener("input", () => {
  radio.volume = volume.value;
});

radio.volume = 0.8;


/* ESTADO DEL AUDIO */

radio.addEventListener("play", () => {
  play.textContent = "❚❚";
});

radio.addEventListener("pause", () => {
  play.textContent = "▶";
});

radio.addEventListener("error", () => {
  console.log("Error de conexión con la radio.");
});


/* SONANDO AHORA */

async function actualizarCancion(){

  try{

    const respuesta = await fetch(
      META_URL + "&t=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!respuesta.ok) return;

    const data = await respuesta.json();

    if(data.loading) return;

    let titulo = data.songtitle || data.song || "";
    let nombreArtista = data.artist || "";

    if(!titulo){
      return;
    }

    /*
      Si la API entrega:
      Artista - Canción
      pero no entrega artist separado,
      intentamos separarlo.
    */

    if(!nombreArtista && titulo.includes(" - ")){

      const partes = titulo.split(" - ");

      nombreArtista = partes.shift();
      titulo = partes.join(" - ");

    }

    song.textContent =
      titulo || "Studio25 en vivo";

    artist.textContent =
      nombreArtista || "Studio25 Radio";

  }catch(error){

    console.log("Metadata no disponible todavía.");

  }

}


/* PRIMERA CONSULTA */

actualizarCancion();


/* ACTUALIZAR CADA 10 SEGUNDOS */

setInterval(actualizarCancion,10000);


/* COMPARTIR */

document.getElementById("share").addEventListener("click", async () => {

  const datos = {
    title:"Studio25 Radio",
    text:"🎵 Escucha Studio25 Radio en vivo",
    url:window.location.href
  };

  try{

    if(navigator.share){

      await navigator.share(datos);

    }else{

      await navigator.clipboard.writeText(window.location.href);

      alert("📻 Enlace de Studio25 copiado. Ahora puedes compartirlo.");

    }

  }catch(error){

    console.log("Compartir cancelado.");

  }

});

</script>

</body>
</html>
