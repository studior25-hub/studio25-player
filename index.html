<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio25 Radio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#3158b8 0%,transparent 38%),
        linear-gradient(145deg,#081329,#173b82,#10285c);
}

.player{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,0.97);
    border-radius:30px;
    padding:42px 28px 35px;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,.40);
}

.logo{
    width:105px;
    height:105px;
    margin:0 auto 22px;
    border-radius:50%;
    background:linear-gradient(145deg,#3478ff,#1855d5);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:40px;
    font-weight:800;
    box-shadow:
        0 12px 30px rgba(37,99,235,.35),
        inset 0 2px 8px rgba(255,255,255,.25);
}

h1{
    margin:0;
    color:#111827;
    font-size:32px;
    letter-spacing:-1px;
}

.subtitle{
    margin-top:8px;
    color:#6b7280;
    font-size:16px;
}

.status{
    margin-top:14px;
    color:#16a34a;
    font-size:18px;
    font-weight:bold;
}

.dot{
    display:inline-block;
    width:11px;
    height:11px;
    margin-right:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

.play-button{
    width:145px;
    height:145px;
    margin:35px auto 28px;
    border:0;
    border-radius:50%;
    background:linear-gradient(145deg,#3478ff,#1855d5);
    color:white;
    font-size:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:
        0 15px 35px rgba(37,99,235,.42),
        inset 0 2px 8px rgba(255,255,255,.22);
    transition:.2s;
}

.play-button:active{
    transform:scale(.94);
}

.play-icon{
    margin-left:7px;
}

.playing{
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 15px 35px rgba(37,99,235,.42);
    }
    50%{
        box-shadow:0 15px 45px rgba(37,99,235,.75);
    }
    100%{
        box-shadow:0 15px 35px rgba(37,99,235,.42);
    }
}

.message{
    color:#6b7280;
    font-size:17px;
    line-height:1.5;
}

.live{
    color:#16a34a;
