<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio25 Radio</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:18px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at 15% 10%,#10275a 0,transparent 32%),
 radial-gradient(circle at 90% 90%,#35103e 0,transparent 35%),
 #02050d;
}

.player{
 width:min(700px,100%);
 padding:24px;
 border:1px solid #29334d;
 border-radius:28px;
 background:rgba(3,7,18,.96);
 box-shadow:0 0 45px rgba(0,100,255,.18);
 text-align:center;
}

.status{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:15px;
}

.live{
 font-size:28px;
 font-weight:bold;
 color:#ff3434;
}

.live:before{
 content:"";
 display:inline-block;
 width:15px;
 height:15px;
 margin-right:8px;
 border-radius:50%;
 background:#ff3030;
 box-shadow:0 0 14px #ff3030;
}

.online{
 padding:10px 15px;
 border:1px solid #30384e;
 border-radius:25px;
 color:#ddd;
}

.online:before{
 content:"";
 display:inline-block;
 width:10px;
 height:10px;
 margin-right:8px;
 border-radius:50%;
 background:#16ed72;
 box-shadow:0 0 10px #16ed72;
}

.tagline{
 font-size:19px;
 color:#ddd;
 margin-bottom:18px;
}

.logo{
 width:100%;
 max-width:430px;
 max-height:390px;
 object-fit:contain;
 display:block;
 margin:0 auto 15px;
 border-radius:20px;
}

.now{
 color:#169dff;
 font-size:25px;
 font-weight:bold;
 margin-top:8px;
}

.song{
 margin-top:14px;
 font-size:29px;
 font-weight:300;
 line-height:1.25;
 color:#fff;
}

.artist{
 margin-top:8px;
 font-size:20px;
 font-weight:300;
 color:#35aaff;
}

.equalizer{
 height:90px;
 margin:20px auto 5px;
 display:flex;
 align-items:end;
 justify-content:center;
 gap:5px;
}

.bar{
 width:7px;
 height:25px;
 border-radius:5px;
 background:linear-gradient(#ff38d0,#188cff);
 box-shadow:0 0 9px #198cff;
 animation:beat .8s infinite alternate;
}

.bar:nth-child(2n){animation-delay:.15s}
.bar:nth-child(3n){animation-delay:.3s}
.bar:nth-child(4n){animation-delay:.45s}

@keyframes beat{
 from{height:15px}
 to{height:75px}
}

.controls{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:30px;
 margin-top:8px;
}

.play{
 width:105px;
 height:105px;
 border-radius:50%;
 border:2px solid #168cff;
 background:#070c18;
 color:#fff;
 font-size:42px;
 cursor:pointer;
 box-shadow:0 0 25px rgba(0,130,255,.35);
}

.play:hover{
 box-shadow:0 0 35px rgba(0,150,255,.65);
}

.volume{
 margin-top:18px;
 display:flex;
 align-items:center;
 gap:10px;
}

.volume span{
 font-size:25px;
}

input[type=range]{
 flex:1;
 accent-color:#168cff;
}

.share{
 width:100%;
 margin-top:25px;
 padding:15px;
 border-radius:30px;
 border:1px solid #168cff;
 background:linear-gradient(90deg,#071c45,#210b31);
 color:white;
 font-size:19px;
 font-weight:bold;
 cursor:pointer;
}

.share:hover{
 box-shadow:0 0 20px rgba(0,120,255,.35);
}

.info{
 margin-top:25px;
 padding-top:20px;
 border-top:1px solid #252c3d;
 color:#bbb;
 font-size:17px;
}

.info b{color:#fff}

.footer{
 margin-top:20px;
 padding:18px;
 border:1px solid #252c3d;
 border-radius:25px;
 color:#ddd;
 font-size:18px;
}

.footer b{color:#169dff}

@media(max-width:520px){
 body{padding:10px}
 .player{padding:18px;border-radius:24px}
 .status{align-items:flex-start}
 .live{font-size:24px}
 .online{font-size:14px;padding:9px}
 .tagline{font-size:17px}
 .logo{max-height:330px}
 .song{font-size:25px}
 .artist{font-size:18px}
 .play{width:92px;height:92px}
}
</style>
</head>

<body>

<div class="player">

 <div class="status">
   <div class="live">EN VIVO</div>
   <div class="online">Señal en línea</div>
 </div>

 <div class="tagline">
   Llevando música y entretención para ti
 </div>

 <!-- LOGO STUDIO25 -->
 <img class="logo"
 src="file_000000001a74720e9d613f259602beca.png"
 alt="Studio25 Radio">

 <div class="now">♪ SONANDO AHORA</div>

 <div id="song" class="song">
   Studio25 Radio
 </div>

 <div id="artist" class="artist">
   Radio Online
 </div>

 <div class="equalizer">
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
   <span class="bar"></span><span class="bar"></span>
 </div>

 <div class="controls">
   <button class="play" id="play">▶</button>
 </div>

 <div class="volume">
   <span>🔊</span>
   <input id="volume" type="range" min="0" max="1"
          step="0.01" value="0.8">
 </div>

 <button class="share" onclick="shareRadio()">
   📤 &nbsp; COMPARTIR RADIO
 </button>

 <div class="info">
   <b>Studio25</b> · Radio Online · <b>Longaví para el mundo</b>
 </div>

 <div class="footer">
   ❤️ Gracias por preferir <b>Studio25</b>
 </div>

 <!-- AUDIO -->
 <audio id="radio" preload="none">
   <!-- AQUÍ VA LA DIRECCIÓN DE TU STREAM -->
 </audio>

</div>

<script>

const radio = document.getElementById("radio");
const play = document.getElementById("play");
const volume = document.getElementById("volume");

radio.volume = 0.8;

play.onclick = function(){

 if(radio.paused){

   radio.play()
   .then(()=>{
      play.textContent="❚❚";
   })
   .catch(()=>{
      alert("No se pudo iniciar la radio. Revisemos la dirección del streaming.");
   });

 }else{

   radio.pause();
   play.textContent="▶";

 }

};

volume.oninput = function(){
 radio.volume=this.value;
};

async function shareRadio(){

 const data={
   title:"Studio25 Radio",
   text:"🎵 Escucha Studio25 Radio — música y entretención para ti",
   url:window.location.href
 };

 if(navigator.share){

   try{
     await navigator.share(data);
   }catch(e){}

 }else{

   try{
     await navigator.clipboard.writeText(window.location.href);
     alert("📋 Enlace de Studio25 copiado");
   }catch(e){
     alert("Comparte esta página desde el navegador.");
   }

 }

}

</script>

</body>
</html>
