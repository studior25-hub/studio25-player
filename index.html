<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:5px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:Arial,Helvetica,sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at 15% 20%,#18295c 0,transparent 35%),
 radial-gradient(circle at 85% 80%,#40144d 0,transparent 35%),
 #030711;
}

.player{
 width:min(420px,100%);
 padding:11px 12px 12px;
 border-radius:20px;
 background:rgba(4,9,20,.96);
 border:1px solid #27334d;
 box-shadow:0 0 30px rgba(0,110,255,.15);
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:5px;
}

.live-title{
 font-size:19px;
 font-weight:800;
}

.live-title.offline{color:#b8bec9}
.live-title.online{color:#ff3030}

.station{
 font-size:16px;
 font-weight:700;
 margin-top:1px;
}

.status{
 padding:6px 8px;
 border:1px solid #27334d;
 border-radius:18px;
 color:#b8bec9;
 font-size:11px;
 white-space:nowrap;
}

.status-dot{
 display:inline-block;
 width:7px;
 height:7px;
 margin-right:4px;
 border-radius:50%;
 background:#777;
}

.status.online{
 color:#d9dce4;
}

.status.online .status-dot{
 background:#20e879;
 box-shadow:0 0 8px #20e879;
}

.description{
 text-align:center;
 font-size:13px;
 color:#e0e2e8;
 margin-bottom:3px;
}

.logo{
 width:100%;
 max-width:245px;
 max-height:175px;
 object-fit:contain;
 display:block;
 margin:0 auto 2px;
}

.now-playing-title{
 text-align:center;
 color:#2196ff;
 font-size:18px;
 font-weight:800;
 margin:2px 0 3px;
}

.song{
 text-align:center;
 font-size:18px;
 line-height:1.1;
 font-weight:400;
 min-height:21px;
}

.artist{
 text-align:center;
 font-size:14px;
 color:#42a5ff;
 margin-top:2px;
 min-height:17px;
}

.equalizer{
 height:30px;
 margin:2px auto;
 display:flex;
 justify-content:center;
 align-items:flex-end;
 gap:3px;
}

.bar{
 width:4px;
 height:6px;
 border-radius:4px;
 background:linear-gradient(to top,#168cff,#8d4cff,#ff43d1);
 box-shadow:0 0 6px rgba(40,150,255,.6);
 animation:equalize .8s ease-in-out infinite alternate;
 animation-play-state:paused;
}

.equalizer.playing .bar{
 animation-play-state:running;
}

.bar:nth-child(2){animation-delay:.10s}
.bar:nth-child(3){animation-delay:.25s}
.bar:nth-child(4){animation-delay:.40s}
.bar:nth-child(5){animation-delay:.15s}
.bar:nth-child(6){animation-delay:.35s}
.bar:nth-child(7){animation-delay:.05s}
.bar:nth-child(8){animation-delay:.30s}
.bar:nth-child(9){animation-delay:.20s}
.bar:nth-child(10){animation-delay:.45s}
.bar:nth-child(11){animation-delay:.10s}
.bar:nth-child(12){animation-delay:.30s}
.bar:nth-child(13){animation-delay:.15s}
.bar:nth-child(14){animation-delay:.40s}
.bar:nth-child(15){animation-delay:.20s}
.bar:nth-child(16){animation-delay:.35s}
.bar:nth-child(17){animation-delay:.05s}
.bar:nth-child(18){animation-delay:.25s}
.bar:nth-child(19){animation-delay:.10s}
.bar:nth-child(20){animation-delay:.40s}
.bar:nth-child(21){animation-delay:.20s}

@keyframes equalize{
 0%{height:6px}
 50%{height:27px}
 100%{height:19px}
}

.play-button{
 width:72px;
 height:72px;
 display:flex;
 justify-content:center;
 align-items:center;
 margin:2px auto 5px;
 border-radius:50%;
 border:2px solid #2196ff;
 background:#07101e;
 color:white;
 font-size:30px;
 cursor:pointer;
 box-shadow:0 0 16px rgba(33,150,255,.38);
}

.play-button:active{
 transform:scale(.94);
}

.playing-button{
 animation:pulse 1.8s infinite;
}

@keyframes pulse{
 50%{box-shadow:0 0 28px rgba(37,99,235,.75)}
}

.volume{
 display:flex;
 align-items:center;
 gap:7px;
 margin:1px 12px 6px;
}

.volume-icon{
 font-size:18px;
}

.volume input{
 flex:1;
 height:16px;
 accent-color:#2196ff;
}

.share-button{
 width:100%;
 padding:8px;
 border-radius:22px;
 border:1px solid #2196ff;
 background:linear-gradient(90deg,rgba(20,65,150,.45),rgba(100,20,100,.45));
 color:white;
 font-size:14px;
 font-weight:700;
 cursor:pointer;
 margin-bottom:6px;
}

.footer-info{
 border-top:1px solid #27334d;
 padding-top:6px;
 text-align:center;
 color:#cbd0dc;
 font-size:14px;
 line-height:1.2;
}

.footer-info strong{color:#fff}

.footer-sub{
 color:#aeb5c4;
 font-size:12px;
}

.thanks{
 margin-top:5px;
 padding:5px;
 border:1px solid #27334d;
 border-radius:16px;
 text-align:center;
 font-size:12px;
 color:#d8dce5;
}

.thanks strong{color:#2196ff}

audio{display:none}

@media(max-height:700px){
 .player{
  padding:8px 10px 9px;
 }

 .logo{
  max-width:215px;
  max-height:145px;
 }

 .equalizer{
  height:25px;
 }

 .play-button{
  width:66px;
  height:66px;
  font-size:27px;
 }
}
</style>
