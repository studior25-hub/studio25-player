<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio25 Radio</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 15% 20%,#18295c 0%,transparent 35%),
        radial-gradient(circle at 85% 80%,#40144d 0%,transparent 35%),
        linear-gradient(145deg,#030711,#05030b);
}

.player{
    width:min(520px,100%);
    padding:25px 22px 28px;
    border-radius:28px;

    background:rgba(4,9,20,.94);

    border:1px solid #27334d;

    box-shadow:
        0 0 50px rgba(0,110,255,.16),
        0 25px 70px rgba(0,0,0,.65);
}

/* CABECERA */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.live-title{
    font-size:30px;
    font-weight:800;
}

.live-title span{
    color:#ff3030;
}

.station{
    font-size:24px;
    font-weight:700;
}

.online{
    padding:10px 15px;
    border:1px solid #27334d;
    border-radius:30px;
    color:#d9dce4;
    font-size:16px;
}

.online-dot{
    display:inline-block;
    width:12px;
    height:12px;
    margin-right:7px;
    border-radius:50%;
    background:#20e879;
    box-shadow:0 0 14px #20e879;
}

.description{
    text-align:center;
    font-size:18px;
    color:#e0e2e8;
    margin-bottom:16px;
}

/* LOGO */

.logo{
    width:100%;
    max-width:430px;
    display:block;
    margin:0 auto 18px;

    border-radius:18px;

    box-shadow:
        0 0 25px rgba(30,130,255,.18),
        0 0 35px rgba(255,30,90,.10);
}

/* SONANDO AHORA */

.now-playing-title{
    text-align:center;
    color:#2196ff;
    font-size:28px;
    font-weight:800;
    margin:8px 0 14px;
}

.song{
    text-align:center;
    font-size:28px;
    line-height:1.25;
    font-weight:400;
    color:#ffffff;
    min-height:38px;
}

.artist{
    text-align:center;
    font-size:19px;
    font-weight:400;
    color:#42a5ff;
    margin-top:8px;
    min-height:25px;
}

/* ECUALIZADOR */

.equalizer{
    height:82px;
    margin:18px auto 14px;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    gap:5px;
}

.bar{
    width:7px;
    height:12px;

    border-radius:6px;

    background:
        linear-gradient(
            to top,
            #168cff,
            #8d4cff,
            #ff43d1
        );

    box-shadow:
        0 0 10px rgba(40,150,255,.65);

    animation:
        equalize .8s ease-in-out infinite alternate;

    animation-play-state:paused;
}

.equalizer.playing .bar{
    animation-play-state:running;
}

.bar:nth-child(2){animation-delay:.10s}
.bar:nth-child(3){animation-delay:.25s}
.bar:nth-child(4){animation-delay:.40s}
.bar:nth-child(5){animation-delay:.15s}
.bar:nth-child(6){animation-delay:.35s}
.bar:nth-child(7){animation-delay:.05s}
.bar:nth-child(8){animation-delay:.30s}
.bar:nth-child(9){animation-delay:.20s}
.bar:nth-child(10){animation-delay:.45s}
.bar:nth-child(11){animation-delay:.10s}
.bar:nth-child(12){animation-delay:.30s}
.bar:nth-child(13){animation-delay:.15s}
.bar:nth-child(14){animation-delay:.40s}
.bar:nth-child(15){animation-delay:.20s}
.bar:nth-child(16){animation-delay:.35s}
.bar:nth-child(17){animation-delay:.05s}
.bar:nth-child(18){animation-delay:.25s}
.bar:nth-child(19){animation-delay:.10s}
.bar:nth-child(20){animation-delay:.40s}
.bar:nth-child(21){animation-delay:.20s}

@keyframes equalize{

    0%{
        height:12px;
    }

    25%{
        height:35px;
    }

    50%{
        height:68px;
    }

    75%{
        height:28px;
    }

    100%{
        height:52px;
    }
}

/* BOTÓN PLAY */

.play-button{

    width:145px;
    height:145px;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:8px auto 25px;

    border-radius:50%;

    border:2px solid #2196ff;

    background:
        linear-gradient(
            145deg,
            #101522,
            #05070c
        );

    color:white;

    font-size:55px;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(33,150,255,.4),
        inset 0 0 15px rgba(33,150,255,.12);

    transition:.2s;
}

.play-button:active{
    transform:scale(.94);
}

.playing-button{
    animation:pulse 1.8s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 15px rgba(37,99,235,.4);
    }

    50%{
        box-shadow:0 0 45px rgba(37,99,235,.8);
    }

    100%{
        box-shadow:0 0 15px rgba(37,99,235,.4);
    }
}

/* VOLUMEN */

.volume{
    display:flex;
    align-items:center;
    gap:12px;
    margin:8px 18px 22px;
}

.volume-icon{
    font-size:28px;
}

.volume input{
    flex:1;
    accent-color:#2196ff;
}

/* COMPARTIR */

.share-button{

    width:100%;

    padding:14px;

    border-radius:30px;

    border:1px solid #2196ff;

    background:
        linear-gradient(
            90deg,
            rgba(20,65,150,.45),
            rgba(100,20,100,.45)
        );

    color:white;

    font-size:20px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(33,150,255,.18);

    margin-bottom:24px;
}

.share-button:active{
    transform:scale(.98);
}

/* INFORMACIÓN FINAL */

.footer-info{

    border-top:1px solid #27334d;

    padding-top:20px;

    text-align:center;

    color:#cbd0dc;

    font-size:20px;

    line-height:1.5;
}

.footer-info strong{
    color:#ffffff;
}

.footer-sub{
    color:#aeb5c4;
    font-size:18px;
}

.thanks{

    margin-top:22px;

    padding:18px;

    border:1px solid #27334d;

    border-radius:28px;

    text-align:center;

    font-size:19px;

    color:#d8dce5;
}

.thanks strong{
    color:#2196ff;
}

/* AUDIO OCULTO */

audio{
    display:none;
}

/* MÓVIL */

@media(max-width:450px){

    body{
        padding:10px;
    }

    .player{
        padding:20px 16px 24px;
    }

    .top{
        gap:10px;
    }

    .live-title{
        font-size:25px;
    }

    .station{
        font-size:21px;
    }

    .online{
        font-size:14px;
        padding:8px 10px;
    }

    .description{
        font-size:17px;
    }

    .song{
        font-size:25px;
    }

    .artist{
        font-size:18px;
    }

    .play-button{
        width:135px;
        height:135px;
    }

}

</style>
</head>


<body>

<div class="player">

    <!-- CABECERA -->

    <div class="top">

        <div>
            <div class="live-title">
                <span>● EN VIVO</span>
            </div>

            <div class="station">
                Studio25
            </div>
        </div>

        <div class="online">
            <span class="online-dot"></span>
            Señal en línea
        </div>

    </div>


    <div class="description">
        Llevando música y entretención para ti
    </div>


    <!-- LOGO -->

    <img
        class="logo"
        src="file_000000001a74720e9d613f259602beca.png"
        alt="Studio25 Radio"
    >


    <!-- SONANDO AHORA -->

    <div class="now-playing-title">
        ♪ SONANDO AHORA
    </div>


    <div class="song" id="song">
        Cargando...
    </div>


    <div class="artist" id="artist">
        Studio25
    </div>


    <!-- ECUALIZADOR -->

    <div class="equalizer" id="equalizer">

        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>

    </div>


    <!-- BOTÓN -->

    <button
        class="play-button"
        id="playButton"
        aria-label="Reproducir radio"
    >
        ▶
    </button>


    <!-- VOLUMEN -->

    <div class="volume">

        <div class="volume-icon">
            🔊
        </div>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.85"
        >

    </div>


    <!-- COMPARTIR -->

    <button
        class="share-button"
        id="shareButton"
    >
        📤 Compartir radio
    </button>


    <!-- INFORMACIÓN FINAL -->

    <div class="footer-info">

        <strong>🌎 Longaví</strong>

        <div class="footer-sub">
            Para el mundo
        </div>

    </div>


    <div class="thanks">
        ❤️ Gracias por preferir
        <strong>Studio25</strong>
    </div>


    <!-- AUDIO -->

    <audio
        id="radio"
        preload="none"
    >

        <source
            src="https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3"
            type="audio/mpeg"
        >

    </audio>

</div>


<script>

/* ELEMENTOS */

const radio =
    document.getElementById("radio");

const playButton =
    document.getElementById("playButton");

const equalizer =
    document.getElementById("equalizer");

const volume =
    document.getElementById("volume");

const song =
    document.getElementById("song");

const artist =
    document.getElementById("artist");

const shareButton =
    document.getElementById("shareButton");


/* VOLUMEN */

radio.volume = 0.85;

volume.addEventListener("input", function(){

    radio.volume = volume.value;

});


/* REPRODUCCIÓN */

playButton.addEventListener("click", async function(){

    if(radio.paused){

        try{

            await radio.play();

        }catch(error){

            console.log("No se pudo iniciar el audio:",error);

        }

    }else{

        radio.pause();

    }

});


/* CUANDO REALMENTE ESTÁ SONANDO */

radio.addEventListener("playing", function(){

    playButton.textContent = "❚❚";

    playButton.classList.add("playing-button");

    equalizer.classList.add("playing");

});


/* PAUSA */

radio.addEventListener("pause", function(){

    playButton.textContent = "▶";

    playButton.classList.remove("playing-button");

    equalizer.classList.remove("playing");

});


/* ESPERANDO AUDIO */

radio.addEventListener("waiting", function(){

    equalizer.classList.remove("playing");

});


/* ERROR */

radio.addEventListener("error", function(){

    playButton.textContent = "▶";

    playButton.classList.remove("playing-button");

    equalizer.classList.remove("playing");

});


/* COMPARTIR */

shareButton.addEventListener("click", async function(){

    const shareData = {

        title:"Studio25 Radio",

        text:"🎵 Escucha Studio25 Radio — música y entretención para ti.",

        url:window.location.href

    };


    if(navigator.share){

        try{

            await navigator.share(shareData);

        }catch(error){

            console.log("Compartir cancelado");

        }

    }else{

        try{

            await navigator.clipboard.writeText(
                window.location.href
            );

            shareButton.textContent =
                "✅ Enlace copiado";

            setTimeout(function(){

                shareButton.textContent =
                    "📤 Compartir radio";

            },2000);

        }catch(error){

            alert("Copia este enlace para compartir Studio25");

        }

    }

});


/* METADATOS DE LA CANCIÓN */

const metadataURL =
    "https://api.twj.es/?url=" +
    encodeURIComponent(
        "https://studio25-radio-online-13fbee.stream.aloncast.com/studio25-radio-online-13fbee.mp3"
    );


async function updateNowPlaying(){

    try{

        const response =
            await fetch(
                metadataURL,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            return;
        }

        const data =
            await response.json();


        /*
          El servicio puede entregar
          songtitle, song o artist.
        */

        let title =
            data.songtitle ||
            data.song ||
            data.title ||
            "";


        let currentArtist =
            data.artist ||
            "";


        /*
          Si solo llega una cadena,
          mostramos la información completa.
        */

        if(title){

            song.textContent = title;

        }


        if(currentArtist){

            artist.textContent =
                currentArtist;

        }else{

            artist.textContent =
                "Studio25";

        }

    }catch(error){

        console.log(
            "No se pudo actualizar SONANDO AHORA"
        );

    }

}


/* ACTUALIZAR AL ABRIR */

updateNowPlaying();


/* ACTUALIZAR CADA 10 SEGUNDOS */

setInterval(
    updateNowPlaying,
    10000
);

</script>

</body>
</html>
